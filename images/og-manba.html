<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>OG manba</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; }
  body {
    background:#0B0C10; color:#fff;
    font-family:Inter,-apple-system,system-ui,sans-serif;
    position:relative; display:flex; flex-direction:column;
    justify-content:center; padding:0 70px;
  }
  body::before, body::after {
    content:''; position:absolute; width:760px; height:760px; border-radius:50%;
    background:radial-gradient(circle, rgba(242,206,154,.11) 0%, rgba(242,206,154,0) 66%);
  }
  body::before { top:-360px; left:-280px; }
  body::after  { bottom:-400px; right:-300px; }
  .in { position:relative; z-index:2; }

  .badge {
    display:inline-flex; align-items:center; gap:10px; align-self:flex-start;
    border:1px solid #272B34; background:#15171D; border-radius:999px; padding:9px 18px;
    font-size:15px; font-weight:600; letter-spacing:.16em; color:#AAB0BC; text-transform:uppercase;
  }
  .dot { width:7px; height:7px; border-radius:50%; background:#F2CE9A; }

  h1 { margin-top:30px; font-size:66px; line-height:1.05; font-weight:800; letter-spacing:-.03em; max-width:1010px; }
  h1 .g { color:#F2CE9A; }
  .sub { margin-top:20px; font-size:32px; line-height:1.24; font-weight:700; color:#F2CE9A; letter-spacing:-.02em; }

  .row { margin-top:42px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .chip {
    border:1px solid #272B34; background:#15171D; border-radius:16px;
    padding:14px 22px; font-size:22px; font-weight:600; color:#fff;
  }
  .chip.gold { border-color:#4A3F22; background:#1B1A14; color:#F2CE9A; display:flex; gap:12px; align-items:baseline; }
  .eski { font-size:18px; color:#6D7481; text-decoration:line-through; }
</style>
</head>
<body>
  <div class="in">
    <div class="badge"><span class="dot"></span>Medion Marketing · Navoiy</div>
    <h1>Mobilografiya va SMM kursi</h1>
    <div class="sub">Bu kurs sizni tomoshabin emas, mutaxassis qiladi</div>
    <div class="row">
      <div class="chip" id="c-boshl"></div>
      <div class="chip" id="c-dav"></div>
      <div class="chip" id="c-format"></div>
      <div class="chip gold"><span id="c-narx"></span><span class="eski" id="c-eski"></span></div>
    </div>
  </div>

<script src="../config.js"></script>
<script>
  var C = window.CONFIG;
  document.getElementById('c-boshl').textContent  = C.BOSHLANISH + ' dan';
  document.getElementById('c-dav').textContent    = C.DAVOMIYLIK;
  document.getElementById('c-format').textContent = C.FORMAT;
  document.getElementById('c-narx').textContent   = C.NARX;
  document.getElementById('c-eski').textContent   = C.NARX_ESKI;
</script>
</body>
</html>
